name: Checks

on:
  push:
  pull_request:

jobs:
  seeds-and-admin-urls:
    name: Seeds and admin URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Seed migrations
        run: npm run check:seeds
      - name: Admin clean URL copies
        run: npm run check:admin-urls

  site:
    name: Build and link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /rosetta-steps
      - name: Links, sitemap and canonicals
        run: npm run check:links
        env:
          NEXT_PUBLIC_BASE_PATH: /rosetta-steps
